<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abouzain</title>
  <link rel="stylesheet" href="includes/style.css">
  <style>
    /* ---------- إعدادات أساسية ---------- */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url('bg.jpg');
      background-size: cover;        /* الخلفية تملأ الشاشة بدون استرتش */
      background-position: center;    /* توسيط الصورة */
      background-repeat: no-repeat;   /* منع التكرار */
      background-attachment: fixed;   /* تثبيت الخلفية */
      
      /* توسيط كل المحتوى في نص الصفحة */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    /* الحاوية الرئيسية: حجمها على قد المحتوى (مش كبيرة) */
    .main-wrapper {
      background: rgba(0, 0, 0, 0.75);
      padding: 25px 30px;
      border-radius: 25px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
      
      /* المربع ياخد حجم المحتوى بس */
      width: auto;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      
      /* مسافة عشان الكلام تحت يظهر */
      margin-bottom: 30px;
    }

    /* العداد الدائري النيوني */
    .neon-timer {
      width: 120px;
      height: 120px;
      border: 5px solid #00d4ff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #00d4ff;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 15px #00d4ff, 0 0 30px #00d4ff;
      margin: 5px auto 10px auto;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
      background: rgba(0, 0, 0, 0.4);
    }

    /* النص الذهبي تحت العداد */
    .blessing-text {
      color: #ffd700;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 0 0 5px #000;
    }

    /* بقية المحتوى */
    h1 {
      font-size: 26px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
      margin: 5px 0 0 0;
    }

    h3#UA {
      color: #aaa;
      margin-top: 0;
      margin-bottom: 12px;
      font-weight: normal;
      font-size: 16px;
      word-break: break-word;
    }

    hr {
      width: 80%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin: 10px auto;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 5px 0;
    }

    form#kernel-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    form#kernel-options label {
      color: #ddd;
      font-size: 15px;
      cursor: pointer;
    }

    button#jeilbrek {
      background: #00d4ff;
      border: none;
      padding: 10px 35px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
      transition: 0.3s;
      min-width: 130px;
    }

    button#jeilbrek:hover {
      transform: scale(1.05);
      background: #00e5ff;
    }

    .autoJb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ddd;
      font-size: 15px;
    }

    .autoJb input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* الكونسول */
    #console {
      background: rgba(22, 27, 34, 0.95);
      color: #00ffcc;
      padding: 12px;
      border-radius: 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      text-align: left;
      min-height: 45px;
      max-height: 110px;
      overflow-y: auto;
      border: 1px solid #30363d;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      width: 100%;
      margin-top: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* النصوص اللي تحت المربع (رقم التليفون والخدمات) */
    .footer-text {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 12px;
      margin-top: 10px;
      max-width: 90%;
      text-align: center;
      line-height: 1.6;
    }

    /* ضبط للأجهزة الصغيرة */
    @media (max-width: 480px) {
      .main-wrapper { padding: 18px 15px; }
      h1 { font-size: 20px; }
      .neon-timer { width: 100px; height: 100px; font-size: 38px; }
      .blessing-text { font-size: 20px; }
      #console { font-size: 12px; max-height: 90px; }
      .footer-text { font-size: 15px; padding: 8px 15px; }
    }
  </style>
</head>
<body>

  <!-- الحاوية الرئيسية (صغيرة على قد المحتوى) -->
  <div class="main-wrapper">

    <!-- العداد الدائري -->
    <div class="neon-timer" id="timer">5</div>
    
    <!-- النص الذهبي -->
    <div class="blessing-text">صل على حبيبك النبي</div>

    <!-- العنوان الجديد -->
    <h1>وعلى نياتكم ترزقون</h1>
    <h3 id="UA">Running on: <span id="userAgentDisplay"></span></h3>

    <hr>

    <div class="btn-container">
      <form id="kernel-options">
        <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
        <label for="netctrl-exploit">NetCtrl</label>
        <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
        <label for="lapse-exploit">Lapse</label>
      </form>
      <button id="jailbreak">Jailbreak</button>
      <div class="autoJb">
        <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
        <input class="mt-2" id="autoJbInput" type="checkbox">
      </div>
    </div>

    <!-- الكونسول -->
    <pre id="console">Ready. Awaiting execution...</pre>

  </div>

  <!-- النصوص اللي تحت المربع (رقم التليفون والخدمات) -->
  <div class="footer-text">
    01279227123<br>
    صيانه دراعات - تغيير معجون حراري اصلي - تعديل اجهزة - تزيل ألعاب -لاجهزة بلايستيشن4 و5
  </div>

  <!-- ملفات التشغيل الأساسية (مش متلمسهم) -->
  <script src="public/src/main.js"></script>
  <script src="public/includes/script.js"></script>

  <!-- سكريبت العداد التنازلي + عرض الـ User Agent -->
  <script>
    (function() {
      // عرض متصفح المستخدم
      const uaSpan = document.getElementById('userAgentDisplay');
      if (uaSpan) {
        uaSpan.textContent = navigator.userAgent;
      }

      // العداد التنازلي
      let count = 5;
      const timerEl = document.getElementById('timer');
      if (timerEl) {
        const interval = setInterval(() => {
          count--;
          timerEl.innerText = count;
          if (count <= 0) {
            clearInterval(interval);
            timerEl.innerText = "GO";
          }
        }, 1000);
      }
    })();
  </script>

</body>
</html>
